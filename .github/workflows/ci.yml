name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore TaskFlow.sln

      - name: Build
        run: dotnet build TaskFlow.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test TaskFlow.sln --configuration Release --no-build
          --collect:"XPlat Code Coverage" --results-directory ./coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: coverage/**/coverage.cobertura.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      JWT_KEY: ci-only-key-used-to-validate-the-compose-file
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
